<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/jpeg" href="favicon.jpeg">
  <title>RULE12</title>
  <style>
    :root{--bg:#0f1115;--card:#171a21;--text:#eaeef5;--muted:#9aa3b2;--line:#2a2f3a;--accent:#2bb3b8}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;height:100%}
    .shell{height:100vh;display:grid;grid-template-rows:auto 1fr}
    .topbar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
    .menu-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#10131a;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
    .menu-btn:focus-visible,.app-link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    .title-wrap{min-width:0;display:grid;gap:2px}
    .title{margin:0;font-size:1rem;line-height:1.2}
    .status{margin:0;color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:75vw}
    .app-host{height:100%;padding:0}
    .app-frame{width:100%;height:100%;border:0;background:#0e1117;display:block}

    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:20}
    .overlay.open{opacity:1;pointer-events:auto}
    .drawer{position:fixed;top:0;left:0;bottom:0;width:min(84vw,320px);background:var(--card);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s ease;z-index:21;padding:12px;display:grid;grid-template-rows:auto 1fr}
    .drawer.open{transform:translateX(0)}
    .drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .drawer h2{margin:0;font-size:1rem}
    .app-list{display:grid;gap:8px;align-content:start}
    .app-link{width:100%;text-align:left;background:#10131a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
    .app-link.active{border-color:var(--accent);background:#0f1b1f}
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <button id="menuBtn" class="menu-btn" aria-label="Open app menu" aria-expanded="false" aria-controls="appDrawer" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="title-wrap">
      <h1 class="title">RULE12 Tool Suite</h1>
      <p id="activeAppStatus" class="status">Loading Landing Zone Calculator...</p>
    </div>
  </header>

  <main class="app-host">
    <iframe id="appFrame" class="app-frame" title="RULE12 Embedded Tool"></iframe>
  </main>

  <div id="menuOverlay" class="overlay" aria-hidden="true"></div>
  <aside id="appDrawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>Apps</h2>
      <button id="closeMenuBtn" class="menu-btn" aria-label="Close app menu" type="button">✕</button>
    </div>
    <nav id="appList" class="app-list" aria-label="Application menu"></nav>
  </aside>
</div>

<script>
const APP_ROUTES={
  landing:{label:'Landing Zone Calculator',path:'apps/landing/index.html'},
  handicap:{label:'Handicap Calculator (WHS)',path:'apps/handicap/index.html'},
  sg:{label:'Strokes Gained GPS Tracker',path:'apps/strokes-gained/index.html'},
  challenge:{label:'Roll Model Golf',path:'apps/RollModelGolf/index.html'}
};

const storageKey='rule12_active_tool_v2';
const frame=document.getElementById('appFrame');
const statusEl=document.getElementById('activeAppStatus');
const appListEl=document.getElementById('appList');
const menuBtn=document.getElementById('menuBtn');
const closeMenuBtn=document.getElementById('closeMenuBtn');
const drawer=document.getElementById('appDrawer');
const overlay=document.getElementById('menuOverlay');

let currentMode='landing';

function setMenuOpen(isOpen){
  drawer.classList.toggle('open',isOpen);
  overlay.classList.toggle('open',isOpen);
  drawer.setAttribute('aria-hidden',String(!isOpen));
  overlay.setAttribute('aria-hidden',String(!isOpen));
  menuBtn.setAttribute('aria-expanded',String(isOpen));
}

function renderAppList(){
  appListEl.innerHTML='';
  Object.entries(APP_ROUTES).forEach(([mode,meta])=>{
    const btn=document.createElement('button');
    btn.type='button';
    btn.className=`app-link${mode===currentMode?' active':''}`;
    btn.textContent=meta.label;
    btn.setAttribute('aria-current',mode===currentMode?'page':'false');
    btn.addEventListener('click',()=>{
      loadTool(mode);
      setMenuOpen(false);
    });
    appListEl.appendChild(btn);
  });
}

function loadTool(mode){
  const selected=APP_ROUTES[mode]||APP_ROUTES.landing;
  currentMode=mode in APP_ROUTES ? mode : 'landing';
  frame.src=selected.path;
  statusEl.textContent=`Active app: ${selected.label}`;
  localStorage.setItem(storageKey,currentMode);
  renderAppList();
}

menuBtn.addEventListener('click',()=>setMenuOpen(true));
closeMenuBtn.addEventListener('click',()=>setMenuOpen(false));
overlay.addEventListener('click',()=>setMenuOpen(false));
document.addEventListener('keydown',(event)=>{ if(event.key==='Escape') setMenuOpen(false); });

const saved=localStorage.getItem(storageKey);
if(saved && APP_ROUTES[saved]) currentMode=saved;
renderAppList();
loadTool(currentMode);
</script>
</body>
</html>
