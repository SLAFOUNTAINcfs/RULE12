<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/jpeg" href="favicon.jpeg">
  <title>RULE12</title>
  <style>
    :root{--bg:#0f1115;--card:#171a21;--text:#eaeef5;--muted:#9aa3b2}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{max-width:1100px;margin:0 auto;padding:16px}
    .card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);margin-bottom:12px}
    h1{margin:0 0 8px;font-size:1.35rem}
    p{margin:6px 0 0;color:var(--muted)}
    label{font-size:.95rem;color:var(--muted);display:block;margin-bottom:6px}
    select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid #2a2f3a;background:#0e1117;color:var(--text);box-sizing:border-box}
    .app-frame{width:100%;height:78vh;min-height:680px;border:1px solid #2a2f3a;border-radius:12px;background:#0e1117}
    .status{font-size:.9rem;color:var(--muted)}
    @media (max-width:820px){.app-frame{height:82vh;min-height:560px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>RULE12 Tool Suite</h1>
    <p>Each dropdown option now runs as its own isolated mini application inside this shell.</p>
  </div>

  <div class="card">
    <label for="toolMode">Select Tool</label>
    <select id="toolMode" aria-label="Select Tool">
      <option value="landing">Landing Zone Calculator</option>
      <option value="handicap">Handicap Calculator (WHS)</option>
      <option value="sg">Strokes Gained GPS Tracker</option>
      <option value="challenge">Roll Model Golf</option>
    </select>
    <p id="activeAppStatus" class="status">Loading Landing Zone Calculator...</p>
  </div>

  <div class="card">
    <iframe id="appFrame" class="app-frame" title="RULE12 Embedded Tool"></iframe>
  </div>
</div>

<script>
const APP_ROUTES={
  landing:{label:'Landing Zone Calculator',path:'apps/landing/index.html'},
  handicap:{label:'Handicap Calculator (WHS)',path:'apps/handicap/index.html'},
  sg:{label:'Strokes Gained GPS Tracker',path:'apps/strokes-gained/index.html'},
  challenge:{label:'Roll Model Golf',path:'apps/RollModelGolf/index.html'}
};

const storageKey='rule12_active_tool_v2';
const modeEl=document.getElementById('toolMode');
const frame=document.getElementById('appFrame');
const statusEl=document.getElementById('activeAppStatus');

function loadTool(mode){
  const selected=APP_ROUTES[mode]||APP_ROUTES.landing;
  frame.src=selected.path;
  statusEl.textContent=`Active tool: ${selected.label}`;
  localStorage.setItem(storageKey,mode in APP_ROUTES ? mode : 'landing');
}

modeEl.addEventListener('change',()=>loadTool(modeEl.value));
const saved=localStorage.getItem(storageKey);
if(saved && APP_ROUTES[saved]) modeEl.value=saved;
loadTool(modeEl.value);
</script>
</body>
</html>
