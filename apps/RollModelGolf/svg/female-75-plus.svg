<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 420 1040"
  preserveAspectRatio="xMidYMin meet"
  role="img"
  aria-labelledby="card-title card-description"
>
  <title id="card-title">Roll Model Golf result</title>
  <desc id="card-description">Heads, die roll 6, Female Ages 75+, tee 3,200 yards, and total-distance club targets.</desc>
  <style>
    .bg { fill: #0F1218; }
    .card { fill: #171B23; stroke: #2A3240; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .section { fill: #1D2330; stroke: #2A3240; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
    .notice { fill: #1D2330; stroke: #F2C94C; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
    .head { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #F4F7FB; }
    .tag { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #F2C94C; }
    .meta { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #F4F7FB; }
    .locktext { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; fill: #6FCF97; }
    .age { font-family: Arial, Helvetica, sans-serif; font-size: 29px; font-weight: 800; fill: #F4F7FB; }
    .teelabel { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #E05A9D; }
    .teevalue { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 800; fill: #F4F7FB; }
    .noticecopy { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; fill: #F2994A; }
    .th { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; fill: #F2C94C; }
    .club { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #F4F7FB; }
    .yards { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 800; fill: #F4F7FB; }
    .rh { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #F4F7FB; }
    .rt { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #AAB3C2; }
    .foot { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 700; fill: #AAB3C2; }
  </style>

  <rect class="bg" x="0" y="0" width="420" height="1040"/>
  <rect class="card" x="8" y="8" width="404" height="1024" rx="22"/>

  <rect class="card" x="8" y="8" width="404" height="182" rx="22"/>
  <rect x="8" y="8" width="404" height="8" rx="4" fill="#E05A9D"/>
  <text x="22" y="42" class="head">Roll Model Golf</text>
  <text x="22" y="61" class="tag">One Flip. One Roll. One Choice.</text>

  <circle cx="56" cy="120" r="31" fill="#E05A9D"/>
  <text x="56" y="127" text-anchor="middle" class="meta" fill="#0F1218">H</text>
  <text x="96" y="117" class="meta">HEADS · FEMALE</text>
  <text x="96" y="139" class="meta">DIE 6</text>

  <rect x="284" y="97" width="116" height="44" rx="10" fill="#0F1218" stroke="#2A3240" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
  <g transform="translate(342 102)">
    <rect x="-8" y="8" width="16" height="13" rx="2" fill="#6FCF97"/>
    <path d="M-4 8V5a4 4 0 0 1 8 0v3" fill="none" stroke="#6FCF97" stroke-width="2" vector-effect="non-scaling-stroke"/>
  </g>
  <text x="342" y="136" text-anchor="middle" class="locktext">LOCKED IN</text>
  

  <text x="210" y="246" text-anchor="middle" class="age">AGES 75+</text>

  <rect class="section" x="22" y="270" width="376" height="90" rx="14"/>
  <text x="210" y="300" text-anchor="middle" class="teelabel">PLAY THE AVAILABLE TEE CLOSEST TO</text>
  <text x="210" y="338" text-anchor="middle" class="teevalue">3,200 YARDS</text>

  <rect class="notice" x="22" y="376" width="376" height="50" rx="12"/>
  <text x="210" y="398" text-anchor="middle" class="noticecopy">ALL DISTANCES ARE TOTAL DISTANCE</text>
  <text x="210" y="416" text-anchor="middle" class="noticecopy">NOT CARRY</text>

  <rect class="section" x="22" y="440" width="376" height="415" rx="14"/>
  <rect x="22" y="440" width="376" height="40" rx="14" fill="#151922"/>
  <text x="34" y="465" class="th">CLUB</text>
  <text x="382" y="465" class="th" text-anchor="end">TOTAL YARDS</text>
  <rect x="22" y="484" width="376" height="23" fill="#1D2330"/>
  <text x="34" y="500" class="club">Driver</text>
  <text x="382" y="500" class="yards" text-anchor="end">155 yd</text>
  <rect x="22" y="507" width="376" height="23" fill="#151922"/>
  <text x="34" y="523" class="club">3W</text>
  <text x="382" y="523" class="yards" text-anchor="end">130 yd</text>
  <rect x="22" y="530" width="376" height="23" fill="#1D2330"/>
  <text x="34" y="546" class="club">5W</text>
  <text x="382" y="546" class="yards" text-anchor="end">110 yd</text>
  <rect x="22" y="553" width="376" height="23" fill="#151922"/>
  <text x="34" y="569" class="club">H1/I2</text>
  <text x="382" y="569" class="yards" text-anchor="end">95 yd</text>
  <rect x="22" y="576" width="376" height="23" fill="#1D2330"/>
  <text x="34" y="592" class="club">3-Iron</text>
  <text x="382" y="592" class="yards" text-anchor="end">98 yd</text>
  <rect x="22" y="599" width="376" height="23" fill="#151922"/>
  <text x="34" y="615" class="club">4-Iron</text>
  <text x="382" y="615" class="yards" text-anchor="end">93 yd</text>
  <rect x="22" y="622" width="376" height="23" fill="#1D2330"/>
  <text x="34" y="638" class="club">5-Iron</text>
  <text x="382" y="638" class="yards" text-anchor="end">88 yd</text>
  <rect x="22" y="645" width="376" height="23" fill="#151922"/>
  <text x="34" y="661" class="club">6-Iron</text>
  <text x="382" y="661" class="yards" text-anchor="end">84 yd</text>
  <rect x="22" y="668" width="376" height="23" fill="#1D2330"/>
  <text x="34" y="684" class="club">7-Iron</text>
  <text x="382" y="684" class="yards" text-anchor="end">80 yd</text>
  <rect x="22" y="691" width="376" height="23" fill="#151922"/>
  <text x="34" y="707" class="club">8-Iron</text>
  <text x="382" y="707" class="yards" text-anchor="end">73 yd</text>
  <rect x="22" y="714" width="376" height="23" fill="#1D2330"/>
  <text x="34" y="730" class="club">9-Iron</text>
  <text x="382" y="730" class="yards" text-anchor="end">65 yd</text>
  <rect x="22" y="737" width="376" height="23" fill="#151922"/>
  <text x="34" y="753" class="club">PW</text>
  <text x="382" y="753" class="yards" text-anchor="end">63 yd</text>
  <rect x="22" y="760" width="376" height="23" fill="#1D2330"/>
  <text x="34" y="776" class="club">GW</text>
  <text x="382" y="776" class="yards" text-anchor="end">54 yd</text>
  <rect x="22" y="783" width="376" height="23" fill="#151922"/>
  <text x="34" y="799" class="club">SW</text>
  <text x="382" y="799" class="yards" text-anchor="end">45 yd</text>
  <rect x="22" y="806" width="376" height="23" fill="#1D2330"/>
  <text x="34" y="822" class="club">LW</text>
  <text x="382" y="822" class="yards" text-anchor="end">30 yd</text>
  <rect x="22" y="829" width="376" height="23" fill="#151922"/>
  <text x="34" y="845" class="club">Putter</text>
  <text x="382" y="845" class="yards" text-anchor="end">ON GREEN</text>

  <rect class="section" x="22" y="875" width="376" height="126" rx="14"/>
  <text x="34" y="900" class="rh">PLAY THIS RESULT</text>
  <text x="34" y="922" class="rt">Use the club with the closest listed total distance.</text>
  <text x="34" y="940" class="rt">Then attempt to hit that required total distance.</text>
  <text x="34" y="958" class="rt">Driver approach: Driver off the deck or next-closest</text>
  <text x="34" y="976" class="rt">available wood, hybrid, or iron.</text>
  <text x="34" y="992" class="rt">Required distance stays the same.</text>

  <text x="210" y="1020" text-anchor="middle" class="foot">TOTAL-DISTANCE GAME TARGETS</text>
</svg>