    .meta{fill:#E7ECF7;font:600 15px 'Segoe UI',sans-serif}
    .metaSmall{fill:#D7DFED;font:600 14px 'Segoe UI',sans-serif}
    .note{fill:#AAB3C2;font:600 13px 'Segoe UI',sans-serif}
    .head{fill:#4EA1FF;font:700 15px 'Segoe UI',sans-serif;letter-spacing:.8px}
    .club{fill:#E7ECF7;font:600 14px 'Segoe UI',sans-serif}
    .val{fill:#F4F7FB;font:700 14px 'Segoe UI',sans-serif}
    .lock{fill:#4EA1FF;font:800 16px 'Segoe UI',sans-serif}
    .rule{fill:#C2CBDC;font:600 12px 'Segoe UI',sans-serif}
