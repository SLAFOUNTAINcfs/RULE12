<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1320" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="title desc">
  <title id="title">Roll Model Golf result card for Female Ages 60-74 Rare</title>
  <desc id="desc">Total-distance game targets. Locked for all 18 holes.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101722"/>
      <stop offset="100%" stop-color="#0B111A"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="404" height="1304" rx="24" fill="url(#bgGrad)" stroke="#4EA1FF" stroke-width="3"/>
  <rect x="22" y="22" width="376" height="1276" rx="18" fill="none" stroke="#4EA1FF26" stroke-width="3"/>
  <text x="210" y="68" text-anchor="middle" class="brand">Roll Model Golf</text>
  <text x="210" y="95" text-anchor="middle" class="sub">One Flip. One Roll. One Choice.</text>
  <g>
    <rect x="132" y="110" width="156" height="36" rx="18" fill="#0F1725" stroke="#4EA1FF" stroke-width="2"/>
    <text x="210" y="134" text-anchor="middle" class="rarity">RARE</text>
  </g>
  
  <g>
    <rect x="24" y="190" width="372" height="168" rx="14" fill="#141D2A" stroke="#2A3445"/>
    <text x="40" y="224" class="meta">Coin: Heads (Female)</text>
    <text x="40" y="252" class="meta">Die: 5 (Ages 60-74)</text>
    <text x="40" y="280" class="meta">Rarity: Rare</text>
    <text x="40" y="308" class="meta">Performance: Established</text>
    <text x="40" y="336" class="meta">Target tee yardage: 3720 yd</text>
  </g>
  <text x="210" y="386" text-anchor="middle" class="note">All distances are total distance, not carry.</text>
  <g>
