    <rect x="26" y="570" width="368" height="28" rx="8" fill="#131A25"/><text x="40" y="589" class="club">Driver</text><text x="378" y="589" text-anchor="end" class="val">170 yd</text><rect x="26" y="601" width="368" height="28" rx="8" fill="#1A2230"/><text x="40" y="620" class="club">3-Wood</text><text x="378" y="620" text-anchor="end" class="val">147 yd</text><rect x="26" y="632" width="368" height="28" rx="8" fill="#131A25"/><text x="40" y="651" class="club">5-Wood</text><text x="378" y="651" text-anchor="end" class="val">124 yd</text><rect x="26" y="663" width="368" height="28" rx="8" fill="#1A2230"/><text x="40" y="682" class="club">H1 / 2-Iron</text><text x="378" y="682" text-anchor="end" class="val">106 yd</text><rect x="26" y="694" width="368" height="28" rx="8" fill="#131A25"/><text x="40" y="713" class="club">3-Iron</text><text x="378" y="713" text-anchor="end" class="val">102 yd</text><rect x="26" y="725" width="368" height="28" rx="8" fill="#1A2230"/><text x="40" y="744" class="club">4-Iron</text><text x="378" y="744" text-anchor="end" class="val">98 yd</text><rect x="26" y="756" width="368" height="28" rx="8" fill="#131A25"/><text x="40" y="775" class="club">5-Iron</text><text x="378" y="775" text-anchor="end" class="val">94 yd</text><rect x="26" y="787" width="368" height="28" rx="8" fill="#1A2230"/><text x="40" y="806" class="club">6-Iron</text><text x="378" y="806" text-anchor="end" class="val">90 yd</text><rect x="26" y="818" width="368" height="28" rx="8" fill="#131A25"/><text x="40" y="837" class="club">7-Iron</text><text x="378" y="837" text-anchor="end" class="val">86 yd</text><rect x="26" y="849" width="368" height="28" rx="8" fill="#1A2230"/><text x="40" y="868" class="club">8-Iron</text><text x="378" y="868" text-anchor="end" class="val">83 yd</text><rect x="26" y="880" width="368" height="28" rx="8" fill="#131A25"/><text x="40" y="899" class="club">9-Iron</text><text x="378" y="899" text-anchor="end" class="val">74 yd</text><rect x="26" y="911" width="368" height="28" rx="8" fill="#1A2230"/><text x="40" y="930" class="club">PW</text><text x="378" y="930" text-anchor="end" class="val">72 yd</text><rect x="26" y="942" width="368" height="28" rx="8" fill="#131A25"/><text x="40" y="961" class="club">GW</text><text x="378" y="961" text-anchor="end" class="val">62 yd</text><rect x="26" y="973" width="368" height="28" rx="8" fill="#1A2230"/><text x="40" y="992" class="club">SW</text><text x="378" y="992" text-anchor="end" class="val">51 yd</text><rect x="26" y="1004" width="368" height="28" rx="8" fill="#131A25"/><text x="40" y="1023" class="club">LW</text><text x="378" y="1023" text-anchor="end" class="val">37 yd</text>
  </g>
  <g>
    <rect x="24" y="1146" width="372" height="142" rx="14" fill="#141D2A" stroke="#2A3445"/>
    <text x="210" y="1174" text-anchor="middle" class="lock">Locked for all 18 holes</text>
    <text x="210" y="1202" text-anchor="middle" class="rule">Driver off the deck allowed, or use the</text>
    <text x="210" y="1224" text-anchor="middle" class="rule">next-closest fairway wood, hybrid, or iron.</text>
    <text x="210" y="1248" text-anchor="middle" class="rule">Putter is always allowed on the putting surface.</text>
  </g>
  <style>
    .brand{fill:#F4F7FB;font:700 27px 'Segoe UI',sans-serif;letter-spacing:.3px}
    .sub{fill:#AAB3C2;font:600 14px 'Segoe UI',sans-serif}
