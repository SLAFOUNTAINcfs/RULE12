<text x="108" y="1127" class="rulehead">HOW TO USE THIS RESULT</text>
<circle cx="115" cy="1161" r="5" fill="#C79A2B"/><text x="136" y="1168" class="rule">Use the club whose printed target is closest to the shot distance.</text>
<circle cx="115" cy="1189" r="5" fill="#C79A2B"/><text x="136" y="1196" class="rule">You must attempt that distance with that assigned club.</text>
<circle cx="115" cy="1217" r="5" fill="#C79A2B"/><text x="136" y="1224" class="rule">Driver approach: Driver off the deck OR next-closest wood/hybrid/iron.</text>
<circle cx="115" cy="1245" r="5" fill="#C79A2B"/><text x="136" y="1252" class="rule">The target never changes. Putter is always allowed on the green.</text>

<text x="78" y="1304" class="footer">RESULT ASSET • ALL DISTANCES ARE TARGET CARRY YARDS</text>
