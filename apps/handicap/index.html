<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handicap Calculator (WHS)</title>
  <style>
    :root{--bg:#0f1115;--card:#171a21;--text:#eaeef5;--muted:#9aa3b2}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{max-width:780px;margin:0 auto;padding:16px}
    .card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
    h1{margin:0 0 8px;font-size:1.3rem}
    label{font-size:.95rem;color:var(--muted);display:block;margin-bottom:6px}
    input,button{width:100%;padding:10px 12px;border-radius:12px;border:1px solid #2a2f3a;background:#0e1117;color:var(--text);box-sizing:border-box}
    button{cursor:pointer;margin-top:10px}
    .badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#10131a;border:1px solid #2a2f3a;font-size:.85rem}
    .minihelp{color:var(--muted);font-size:.9rem;margin-top:8px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Handicap Calculator (WHS)</h1>
    <form id="form" autocomplete="off">
      <label for="handicapIndex">Handicap Index</label>
      <input id="handicapIndex" type="number" step="0.1" min="-10" max="54" placeholder="e.g. 12.3">
      <label for="slopeRating">Slope Rating</label>
      <input id="slopeRating" type="number" step="1" min="55" max="155" placeholder="e.g. 125">
      <label for="courseRating">Course Rating</label>
      <input id="courseRating" type="number" step="0.1" min="60" max="80" placeholder="e.g. 71.2">
      <label for="par">Par</label>
      <input id="par" type="number" step="1" min="60" max="80" placeholder="e.g. 72">
      <label for="pcc">Playing Conditions Calculation (PCC, optional)</label>
      <input id="pcc" type="number" step="1" min="-3" max="3" placeholder="e.g. 0">
      <button type="submit">Calculate Course Handicap</button>
    </form>
    <div id="result" class="minihelp"></div>
    <div class="minihelp">Formula: Course Handicap = (Handicap Index × Slope Rating / 113) + (Course Rating − Par) [+ PCC]</div>
  </div>
</div>
<script>
document.getElementById('form').addEventListener('submit',function(e){
  e.preventDefault();
  const idx=parseFloat(document.getElementById('handicapIndex').value);
  const slope=parseFloat(document.getElementById('slopeRating').value);
  const cr=parseFloat(document.getElementById('courseRating').value);
  const par=parseFloat(document.getElementById('par').value);
  const pccRaw=document.getElementById('pcc').value;
  const pcc=pccRaw===''?0:parseFloat(pccRaw);
  const out=document.getElementById('result');
  if(!isFinite(idx)||!isFinite(slope)||!isFinite(cr)||!isFinite(par)){
    out.textContent='Please fill in all required fields.';
    return;
  }
  const courseHandicap=(idx*slope/113)+(cr-par)+pcc;
  out.innerHTML=`<b>Course Handicap:</b> <span class="badge">${Math.round(courseHandicap)}</span>`;
});
</script>
</body>
</html>
